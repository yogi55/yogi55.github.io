<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Хронологія робіт — Георгій Сагітов</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #262626;
      --card: #666;
      --line: #e9e6df;
      --text: #fff;
      --muted: #bdbdbd;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); scrollbar-width: none; -ms-overflow-style: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; width: 0; height: 0; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Unbounded", system-ui, sans-serif;
    }

    /* Шапка + лічильник років: завжди зверху */
    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      text-align: center;
      padding: clamp(18px, 4.5vh, 44px) 16px 10px;
    }
    .top h1 { margin: 0; font-weight: 600; font-size: clamp(18px, 2.4vw, 32px); line-height: 1.2; }
    .top h1 a { color: inherit; text-decoration: none; }
    .role { margin: 6px 0 0; font-weight: 500; font-size: clamp(10px, 1.05vw, 15px); }
    .contacts { margin: 6px 0 0; font-weight: 200; font-size: clamp(10px, 1vw, 14px); color: var(--muted); }
    .contacts a { color: inherit; text-decoration: none; }
    .contacts a:hover { color: var(--text); }
    .contacts span { margin: 0 .5em; }

    .counter {
      --h: 1.15em;
      display: flex;
      justify-content: center;
      margin-top: clamp(10px, 2.6vh, 28px);
      font-weight: 200;
      font-size: clamp(34px, 5.6vw, 76px);
      line-height: var(--h);
      height: var(--h);
      overflow: hidden;
    }
    .digit { display: block; height: var(--h); overflow: hidden; }
    .strip { display: block; transition: transform .9s cubic-bezier(.2, .8, .2, 1); }
    .strip span { display: block; height: var(--h); line-height: var(--h); }

    /* Рік = звичайний блок на сторінці: стрілка, під нею сітка робіт */
    .track { position: relative; }
    .pin { position: sticky; top: var(--topH, 200px); overflow: hidden; overflow: clip; }
    .world { position: relative; will-change: transform; }

    .stem { position: absolute; left: 50%; top: 0; width: 1px; margin-left: -.5px; height: 0; }
    .stem i {
      position: absolute;
      left: 0;
      top: 0;
      width: 1px;
      height: 0;
      background: var(--line);
    }
    .stem b {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 8px;
      height: 8px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      transform: translate(-50%, -4px) rotate(45deg);
    }

    .grid { position: relative; margin: 0 auto; }
    .card {
      position: absolute;
      margin: 0;
      background: var(--card);
      outline: 1px solid rgba(255, 255, 255, .06);
      will-change: transform;
    }
    .card img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* Лінії руху за карткою, коли вона летить знизу */
    .trail { position: absolute; left: 0; top: 100%; width: 100%; height: var(--tr, 0px); pointer-events: none; }
    .trail u { position: absolute; top: 8px; width: 1px; background: linear-gradient(var(--line), rgba(233,230,223,0)); }
    .trail u:nth-child(1) { left: 18%; height: 70%; }
    .trail u:nth-child(2) { left: 50%; height: 100%; }
    .trail u:nth-child(3) { left: 82%; height: 85%; }

    /* Перегляд роботи на весь екран */
    .card { cursor: pointer; }
    .card:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .lb {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: rgba(20, 20, 20, .98);
      opacity: 0; visibility: hidden;
      transition: opacity .25s, visibility .25s;
    }
    .lb.open { opacity: 1; visibility: visible; }
    .lb figure { position: relative; margin: 0; transform: scale(.97); transition: transform .3s; }
    .lb.open figure { transform: none; }
    .lb-body.ph { height: min(80vh, calc(88vw * 1.414)); aspect-ratio: 1 / 1.414; background: var(--card); }
    .lb-body img { display: block; max-width: 92vw; max-height: 80vh; }
    .lb figcaption {
      position: absolute; left: 50%; top: 100%; transform: translateX(-50%);
      margin-top: 14px; white-space: nowrap;
      font-weight: 200; font-size: 13px; color: var(--muted);
    }
    .lb-btn {
      position: absolute; background: none; border: 0; color: #fff;
      font: inherit; font-weight: 200; line-height: 1; cursor: pointer;
      padding: 12px 16px; opacity: .8;
    }
    .lb-btn:hover, .lb-btn:focus-visible { opacity: 1; }
    .lb-close { top: 14px; right: 14px; font-size: 40px; }
    .lb-prev, .lb-next { top: 50%; transform: translateY(-50%); font-size: 56px; }
    .lb-prev { left: 8px; }
    .lb-next { right: 8px; }

    .end { height: 40vh; }
    noscript p { text-align: center; color: var(--muted); padding: 40px 16px; }
  </style>
</head>
<body>
  <header class="top">
    <h1><a href="/">Георгій Сагітов</a></h1>
    <p class="role">Графічний дизайнер, аніматор, художник</p>
    <p class="contacts">
      <a href="https://www.instagram.com/yogi55/">Instagram</a><span>|</span><a href="https://www.facebook.com/yogi55">Facebook</a>
    </p>
    <div class="counter" id="counter" role="img" aria-label="2014"></div>
  </header>

  <main id="years"></main>
  <noscript><p>Для перегляду хронології потрібен JavaScript.</p></noscript>

  <script>
  (function () {
    /* ---- ДАНІ ----
       Поки що це сірі заглушки. Щоб додати справжню роботу, замініть {} на
       { src: "img/2014/01.webp", title: "Назва" }.
       Пропорція карток завжди A4. */
    var placeholders = function (n) { var a = []; for (var i = 0; i < n; i++) a.push({}); return a; };
    var YEARS = [
      { year: 2014, works: placeholders(5) },
      { year: 2015, works: placeholders(10) },
      { year: 2016, works: placeholders(8) }
    ];

    /* ---- ВІДЧУТТЯ СКРОЛУ (у пікселях скролу; одне «клацання» колеса ≈ 100 px) ---- */
    var FEEL = {
      arrow: 350,      /* стрілка витягується вниз */
      hold: 250,       /* пауза між роками: ~2-3 клацання */
      liftRatio: 1.6,  /* скільки скролу на 1 px підйому вмісту (більше = повільніше) */
      flyBase: 250,    /* політ року: базова довжина ... */
      perWork: 80      /* ... плюс по стільки на кожну роботу (~1 клацання на роботу) */
    };

    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var topEl = document.querySelector(".top");
    var main = document.getElementById("years");
    var counter = document.getElementById("counter");
    var COLS = 5, A4 = 1.414;

    /* ---- Лічильник років: 4 колонки цифр, що прокручуються ---- */
    var strips = [];
    for (var i = 0; i < 4; i++) {
      var d = document.createElement("span"); d.className = "digit";
      var s = document.createElement("span"); s.className = "strip";
      for (var n = 0; n < 10; n++) { var c = document.createElement("span"); c.textContent = n; s.appendChild(c); }
      d.appendChild(s); counter.appendChild(d); strips.push(s);
    }
    var shownYear = null;
    function setYear(y) {
      if (y === shownYear) return;
      shownYear = y;
      String(y).split("").forEach(function (ch, i) { strips[i].style.transform = "translateY(" + (-ch * 1.15) + "em)"; });
      counter.setAttribute("aria-label", String(y));
    }

    /* ---- Одна суцільна сітка: роботи всіх років підряд, кожен рік з нового ряду ---- */
    var stem = document.createElement("div"); stem.className = "stem"; stem.innerHTML = "<i><b></b></i>";
    var line = stem.firstChild;
    var grid = document.createElement("div"); grid.className = "grid";
    var track = document.createElement("div"); track.className = "track";
    var pin = document.createElement("div"); pin.className = "pin";
    var world = document.createElement("div"); world.className = "world";
    world.appendChild(stem); world.appendChild(grid); pin.appendChild(world); track.appendChild(pin); main.appendChild(track);
    var totalRows = 0;
    var sections = YEARS.map(function (y) {
      var cards = y.works.map(function (w, wi) {
        var c = document.createElement("figure"); c.className = "card";
        c.tabIndex = 0; c.setAttribute("role", "button");
        c.setAttribute("aria-label", y.year + ", робота " + (wi + 1) + (w.title ? ": " + w.title : ""));
        if (w.src) { var im = new Image(); im.src = w.src; im.alt = w.title || ""; im.loading = "lazy"; c.appendChild(im); }
        var t = document.createElement("div"); t.className = "trail"; t.innerHTML = "<u></u><u></u><u></u>";
        c.appendChild(t); grid.appendChild(c);
        return c;
      });
      var sec = { year: y.year, cards: cards, rowStart: totalRows, rows: Math.ceil(cards.length / COLS) };
      totalRows += Math.ceil(cards.length / COLS);
      return sec;
    });

    /* ---- Перегляд роботи на весь екран ---- */
    var flat = [];
    sections.forEach(function (s, si) {
      s.cards.forEach(function (c, i) {
        flat.push({ card: c, year: s.year, n: i + 1, total: s.cards.length, w: YEARS[si].works[i] });
      });
    });
    var lb = document.createElement("div");
    lb.className = "lb"; lb.setAttribute("role", "dialog"); lb.setAttribute("aria-modal", "true");
    lb.setAttribute("aria-label", "Перегляд роботи");
    lb.innerHTML = '<button class="lb-btn lb-close" aria-label="Закрити">×</button>' +
      '<button class="lb-btn lb-prev" aria-label="Попередня">‹</button>' +
      '<button class="lb-btn lb-next" aria-label="Наступна">›</button>' +
      '<figure><div class="lb-body"></div><figcaption></figcaption></figure>';
    document.body.appendChild(lb);
    var lbBody = lb.querySelector(".lb-body"), lbCap = lb.querySelector("figcaption");
    var cur = -1, lastFocus = null;
    function show(i) {
      cur = (i + flat.length) % flat.length;
      var it = flat[cur];
      lbBody.innerHTML = "";
      if (it.w.src) {
        var im = new Image(); im.src = it.w.src; im.alt = it.w.title || "";
        lbBody.className = "lb-body"; lbBody.appendChild(im);
      } else {
        lbBody.className = "lb-body ph";
      }
      lbCap.textContent = it.year + " · " + it.n + " / " + it.total + (it.w.title ? " · " + it.w.title : "");
    }
    function openLb(i) {
      lastFocus = document.activeElement;
      show(i); lb.classList.add("open");
      lb.querySelector(".lb-close").focus({ preventScroll: true });
    }
    function closeLb() {
      lb.classList.remove("open"); cur = -1;
      if (lastFocus && lastFocus.focus) lastFocus.focus({ preventScroll: true });
    }
    flat.forEach(function (it, i) {
      it.card.addEventListener("click", function () { openLb(i); });
      it.card.addEventListener("keydown", function (e) {
        if (e.key === "Enter" || e.key === " ") { e.preventDefault(); openLb(i); }
      });
    });
    lb.addEventListener("click", function (e) { if (e.target === lb) closeLb(); });
    lb.querySelector(".lb-close").addEventListener("click", closeLb);
    lb.querySelector(".lb-prev").addEventListener("click", function () { show(cur - 1); });
    lb.querySelector(".lb-next").addEventListener("click", function () { show(cur + 1); });
    document.addEventListener("keydown", function (e) {
      if (cur < 0) return;
      if (e.key === "Escape") closeLb();
      else if (e.key === "ArrowLeft") show(cur - 1);
      else if (e.key === "ArrowRight") show(cur + 1);
    });
    /* поки відкрито перегляд, фон не гортається */
    ["wheel", "touchmove"].forEach(function (t) {
      lb.addEventListener(t, function (e) { e.preventDefault(); }, { passive: false });
    });
    var tx = null;
    lb.addEventListener("touchstart", function (e) { tx = e.touches[0].clientX; }, { passive: true });
    lb.addEventListener("touchend", function (e) {
      if (tx === null) return;
      var dx = e.changedTouches[0].clientX - tx; tx = null;
      if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1));
    }, { passive: true });

    /* ---- Геометрія і сценарій скролу ----
       Сцена закріплена під шапкою, а скрол керує «сценарієм»:
       стрілка тягнеться вниз → роботи року по одній прилітають і стають на місце, стрілка вкорочується →
       пауза → наступний рік долітає під попередні (вміст при цьому поступово піднімається) … */
    var G = {}, segs = [], totalLen = 0;
    function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
    function ease(t) { return 1 - Math.pow(1 - t, 3); }

    function measure() {
      var vh = window.innerHeight, vw = window.innerWidth;
      var topH = topEl.offsetHeight;
      var pinH = Math.max(300, vh - topH);
      var gap = vw < 600 ? 6 : 15;
      var gridW = Math.min(860, vw * 0.92);
      var cw = Math.min(156, (gridW - gap * (COLS - 1)) / COLS);
      var ch = cw * A4;
      var stemBlock = Math.max(70, Math.min(100, vh * 0.085));   /* відстань від року до першого ряду */
      var gridH = totalRows * ch + (totalRows - 1) * gap;
      G = { vh: vh, topH: topH, pinH: pinH, gap: gap, cw: cw, ch: ch,
            stemBlock: stemBlock, Lrest: stemBlock - 14, Llong: pinH - 24,
            worldH: stemBlock + gridH + vh * 0.08,
            hold: FEEL.hold };
      var rowW = COLS * cw + (COLS - 1) * gap;
      document.documentElement.style.setProperty("--topH", topH + "px");
      pin.style.height = pinH + "px";
      grid.style.width = rowW + "px";
      grid.style.height = gridH + "px";
      world.style.paddingTop = stemBlock + "px";   /* padding, а не margin: щоб відступ не «схлопувався» */
      sections.forEach(function (s) {
        s.cards.forEach(function (c, i) {
          var row = s.rowStart + Math.floor(i / COLS);
          c.style.width = cw + "px"; c.style.height = ch + "px";
          c.style.left = ((i % COLS) * (cw + gap)) + "px";
          c.style.top = (row * (ch + gap)) + "px";
        });
      });

      /* сценарій */
      segs = [];
      var eff = 0;
      /* Вміст ніколи не зупиняється «на півдорозі»: верхній ряд або стоїть рівно під шапкою, або повністю сховався вгору */
      function snapEff(minEff) {
        if (minEff <= 0) return 0;
        var base = stemBlock - gap, stride = ch + gap;
        return base + Math.max(0, Math.ceil((minEff - base) / stride)) * stride;
      }
      function fitEff(s) {   /* найменше «чисте» положення, при якому увесь рік видно на екрані */
        var bottom = stemBlock + (s.rowStart + s.rows) * (ch + gap) - gap;
        return snapEff(bottom - pinH + 24);
      }
      if (reduce) {
        var last = Math.max.apply(null, sections.map(fitEff));
        segs.push({ t: "scroll", a: 0, b: last, len: last });
      } else {
        segs.push({ t: "arrow", len: FEEL.arrow });
        sections.forEach(function (s, k) {
          var n = s.cards.length, w = 0.4, step = n > 1 ? (1 - w) / (n - 1) : 0;
          if (k > 0) segs.push({ t: "hold", len: FEEL.hold });
          /* рік летить рядами: підсув угору лише тоді, коли наступному ряду бракує місця; старі ряди лишаються на екрані */
          var from = 0;
          for (var r = 0; r < s.rows; r++) {
            var lastIdx = Math.min(n - 1, (r + 1) * COLS - 1);
            var to = r === s.rows - 1 ? 1 : lastIdx * step + w;
            var bottom = stemBlock + (s.rowStart + r + 1) * (ch + gap) - gap;
            var ne = Math.max(eff, snapEff(bottom - pinH + 24));
            if (ne > eff) { segs.push({ t: "lift", a: eff, b: ne, len: (ne - eff) * FEEL.liftRatio }); eff = ne; }
            var cnt = lastIdx - r * COLS + 1;
            segs.push({ t: "fly", k: k, a: from, b: to, len: FEEL.flyBase * (to - from) + FEEL.perWork * cnt });
            from = to;
          }
        });
      }
      totalLen = segs.reduce(function (n, sg) { return n + sg.len; }, 0);
      track.style.height = (pinH + totalLen) + "px";
    }

    function stateAt(sy) {
      var st = { eff: 0, arrow: reduce ? 1 : 0, fly: sections.map(function () { return reduce ? 1 : 0; }) };
      var pos = 0;
      for (var i = 0; i < segs.length; i++) {
        var sg = segs[i], p = clamp((sy - pos) / (sg.len || 1), 0, 1);
        if (sg.t === "arrow") st.arrow = p;
        else if (sg.t === "fly") st.fly[sg.k] = sg.a + (sg.b - sg.a) * p;
        else if (sg.t === "lift") st.eff = sg.a + (sg.b - sg.a) * (p < 0.5 ? 2 * p * p : 1 - 2 * (1 - p) * (1 - p));
        else if (sg.t === "scroll") st.eff = sg.a + (sg.b - sg.a) * p;
        pos += sg.len;
        if (sy < pos) break;
      }
      return st;
    }

    /* ---- Кадр: усе залежить тільки від позиції скролу ---- */
    function frame() {
      var gap = G.gap, ch = G.ch;
      var st = stateAt(window.pageYOffset);
      world.style.transform = "translate3d(0," + (-st.eff) + "px,0)";

      var active = sections[0].year, minTop = Infinity;
      sections.forEach(function (s, k) {
        var n = s.cards.length, w = 0.4;                  /* кожна картка летить 40% часу року, решта — черга */
        var step = n > 1 ? (1 - w) / (n - 1) : 0, firstE = 0;
        s.cards.forEach(function (c, i) {
          var col = i % COLS, rowL = Math.floor(i / COLS);
          var e = reduce ? 1 : ease(clamp((st.fly[k] - i * step) / w, 0, 1));
          var restY = G.stemBlock + (s.rowStart + rowL) * (ch + gap) - st.eff;   /* де картка стоїть на місці (у сцені) */
          var off = (1 - e) * Math.max(0, G.pinH - restY + 40);                  /* завжди стартує під нижнім краєм екрана */
          c.style.transform = "translate3d(0," + off + "px,0)";
          c.style.setProperty("--tr", Math.min(240, (1 - e) * (60 + col * 35 + (s.rowStart + rowL) * 15)) + "px");
          minTop = Math.min(minTop, G.stemBlock + (s.rowStart + rowL) * (ch + gap) + off);
          if (i === 0) firstE = e;
        });
        if (firstE > 0.3) active = s.year;
      });

      /* стрілка: спершу тягнеться вниз у порожній екран, потім вкорочується, поки роботи займають місце під нею */
      var tipA = G.Lrest + (G.Llong - G.Lrest) * ease(st.arrow);
      line.style.height = clamp(Math.min(tipA, minTop - 14), G.Lrest, G.Llong) + "px";
      setYear(active);
    }

    var queued = false;
    function request() {
      if (queued) return; queued = true;
      requestAnimationFrame(function () { queued = false; frame(); });
    }
    window.addEventListener("scroll", request, { passive: true });
    window.addEventListener("resize", function () { measure(); request(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { measure(); request(); });

    measure();
    frame();
  })();
  </script>
</body>
</html>
