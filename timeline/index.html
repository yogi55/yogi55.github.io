<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Хронологія робіт — Георгій Сагітов</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@200;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #262626;
      --card: #666;
      --line: #e9e6df;
      --text: #fff;
      --muted: #bdbdbd;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: "Unbounded", system-ui, sans-serif;
    }

    /* Шапка + лічильник років: завжди зверху */
    .top {
      position: sticky;
      top: 0;
      z-index: 10;
      background: var(--bg);
      text-align: center;
      padding: clamp(18px, 4.5vh, 44px) 16px 10px;
    }
    .top::after {
      content: "";
      position: absolute;
      left: 0; right: 0; top: 100%;
      height: 28px;
      background: linear-gradient(var(--bg), rgba(38,38,38,0));
      pointer-events: none;
    }
    .top h1 { margin: 0; font-weight: 600; font-size: clamp(18px, 2.4vw, 32px); line-height: 1.2; }
    .top h1 a { color: inherit; text-decoration: none; }
    .role { margin: 6px 0 0; font-weight: 500; font-size: clamp(10px, 1.05vw, 15px); }
    .contacts { margin: 6px 0 0; font-weight: 200; font-size: clamp(10px, 1vw, 14px); color: var(--muted); }
    .contacts a { color: inherit; text-decoration: none; }
    .contacts a:hover { color: var(--text); }
    .contacts span { margin: 0 .5em; }

    .counter {
      --h: 1.15em;
      display: flex;
      justify-content: center;
      margin-top: clamp(10px, 2.6vh, 28px);
      font-weight: 200;
      font-size: clamp(34px, 5.6vw, 76px);
      line-height: var(--h);
      height: var(--h);
      overflow: hidden;
    }
    .digit { display: block; height: var(--h); overflow: hidden; }
    .strip { display: block; transition: transform .9s cubic-bezier(.2, .8, .2, 1); }
    .strip span { display: block; height: var(--h); line-height: var(--h); }

    /* Рік = висока секція; сцена всередині "прилипає" під шапкою */
    .year { position: relative; }
    .stage { position: sticky; top: var(--topH, 200px); overflow: hidden; }

    .stem {
      position: absolute;
      left: 50%;
      top: 0;
      width: 1px;
      margin-left: -.5px;
      background: var(--line);
    }
    .stem b {
      position: absolute;
      left: 50%;
      bottom: 0;
      width: 8px;
      height: 8px;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      transform: translate(-50%, -4px) rotate(45deg);
    }

    .grid { position: absolute; left: 50%; top: 0; }
    .card {
      position: absolute;
      margin: 0;
      background: var(--card);
      outline: 1px solid rgba(255, 255, 255, .06);
      will-change: transform;
    }
    .card img { display: block; width: 100%; height: 100%; object-fit: cover; }

    /* Лінії руху за карткою, коли вона летить знизу */
    .trail { position: absolute; left: 0; top: 100%; width: 100%; height: var(--tr, 0px); pointer-events: none; }
    .trail u { position: absolute; top: 8px; width: 1px; background: linear-gradient(var(--line), rgba(233,230,223,0)); }
    .trail u:nth-child(1) { left: 18%; height: 70%; }
    .trail u:nth-child(2) { left: 50%; height: 100%; }
    .trail u:nth-child(3) { left: 82%; height: 85%; }

    .end { height: 24vh; }
    noscript p { text-align: center; color: var(--muted); padding: 40px 16px; }
  </style>
</head>
<body>
  <header class="top">
    <h1><a href="/">Георгій Сагітов</a></h1>
    <p class="role">Графічний дизайнер, аніматор, художник</p>
    <p class="contacts">
      <a href="https://www.instagram.com/yogi55/">Instagram</a><span>|</span><a href="https://www.facebook.com/yogi55">Facebook</a>
    </p>
    <div class="counter" id="counter" role="img" aria-label="2014"></div>
  </header>

  <main id="years"></main>
  <div class="end"></div>
  <noscript><p>Для перегляду хронології потрібен JavaScript.</p></noscript>

  <script>
  (function () {
    /* ---- ДАНІ ----
       Поки що це сірі заглушки. Щоб додати справжню роботу, замініть {} на
       { src: "img/2014/01.webp", title: "Назва" }.
       Пропорція карток завжди A4. */
    var placeholders = function (n) { var a = []; for (var i = 0; i < n; i++) a.push({}); return a; };
    var YEARS = [
      { year: 2014, works: placeholders(5) },
      { year: 2015, works: placeholders(10) },
      { year: 2016, works: placeholders(8) }
    ];

    var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var topEl = document.querySelector(".top");
    var main = document.getElementById("years");
    var counter = document.getElementById("counter");
    var COLS = 5, A4 = 1.414;

    /* ---- Лічильник років: 4 колонки цифр, що прокручуються ---- */
    var strips = [];
    for (var i = 0; i < 4; i++) {
      var d = document.createElement("span"); d.className = "digit";
      var s = document.createElement("span"); s.className = "strip";
      for (var n = 0; n < 10; n++) { var c = document.createElement("span"); c.textContent = n; s.appendChild(c); }
      d.appendChild(s); counter.appendChild(d); strips.push(s);
    }
    var shownYear = null;
    function setYear(y) {
      if (y === shownYear) return;
      shownYear = y;
      String(y).split("").forEach(function (ch, i) { strips[i].style.transform = "translateY(" + (-ch * 1.15) + "em)"; });
      counter.setAttribute("aria-label", String(y));
    }

    /* ---- Секції років ---- */
    var sections = YEARS.map(function (y) {
      var sec = document.createElement("section"); sec.className = "year";
      var stage = document.createElement("div"); stage.className = "stage";
      var stem = document.createElement("div"); stem.className = "stem"; stem.innerHTML = "<b></b>";
      var grid = document.createElement("div"); grid.className = "grid";
      var cards = y.works.map(function (w) {
        var c = document.createElement("figure"); c.className = "card";
        if (w.src) { var im = new Image(); im.src = w.src; im.alt = w.title || ""; im.loading = "lazy"; c.appendChild(im); }
        var t = document.createElement("div"); t.className = "trail"; t.innerHTML = "<u></u><u></u><u></u>";
        c.appendChild(t); grid.appendChild(c);
        return c;
      });
      stage.appendChild(stem); stage.appendChild(grid); sec.appendChild(stage); main.appendChild(sec);
      return { year: y.year, sec: sec, stage: stage, stem: stem, grid: grid, cards: cards };
    });

    /* ---- Геометрія ---- */
    var G = {};
    function measure() {
      var vh = window.innerHeight, vw = window.innerWidth;
      var topH = topEl.offsetHeight;
      var stageH = Math.max(320, vh - topH);
      var gap = vw < 600 ? 6 : 15;
      var gridW = Math.min(860, vw * 0.92);
      var cw = Math.min(156, (gridW - gap * (COLS - 1)) / COLS);
      var ch = cw * A4;
      var Ls = Math.max(56, Math.min(110, vh * 0.1));
      G = { vh: vh, topH: topH, stageH: stageH, gap: gap, cw: cw, ch: ch,
            Ls: Ls, Llong: stageH - 24, y0: Ls + 14, runway: reduce ? 0 : vh * 1.5 };
      document.documentElement.style.setProperty("--topH", topH + "px");
      sections.forEach(function (s) {
        s.sec.style.height = (stageH + G.runway) + "px";
        s.stage.style.height = stageH + "px";
        var rowW = COLS * cw + (COLS - 1) * gap;
        s.grid.style.width = rowW + "px";
        s.grid.style.marginLeft = (-rowW / 2) + "px";
        s.grid.style.top = G.y0 + "px";
        s.cards.forEach(function (c, i) {
          c.style.width = cw + "px"; c.style.height = ch + "px";
          c.style.left = ((i % COLS) * (cw + gap)) + "px";
          c.style.top = (Math.floor(i / COLS) * (ch + gap)) + "px";
        });
      });
    }

    function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
    function ease(t) { return 1 - Math.pow(1 - t, 3); }

    /* ---- Кадр: усе залежить тільки від позиції скролу ---- */
    function frame() {
      var topH = G.topH, stageH = G.stageH, y0 = G.y0, ch = G.ch, gap = G.gap;
      var active = sections[0].year;
      sections.forEach(function (s) {
        var r = s.sec.getBoundingClientRect();
        var p = reduce ? 1 : clamp((topH - r.top) / G.runway, 0, 1);
        if (r.top <= topH + stageH * 0.5) active = s.year;

        /* 1) стрілка витягується вниз */
        var tip = G.Ls + (G.Llong - G.Ls) * ease(clamp(p / 0.2, 0, 1));

        /* 2) роботи прилітають знизу, кожна зі своєю затримкою */
        var minTop = Infinity;
        s.cards.forEach(function (c, i) {
          var col = i % COLS, row = Math.floor(i / COLS);
          var start = 0.22 + col * 0.035 + row * 0.05;
          var e = ease(clamp((p - start) / 0.3, 0, 1));
          var rest = y0 + row * (ch + gap);
          var off = (1 - e) * (stageH - rest + 30);
          c.style.transform = "translate3d(0," + off + "px,0)";
          c.style.setProperty("--tr", Math.min(240, (1 - e) * (50 + col * 40 + row * 30)) + "px");
          minTop = Math.min(minTop, rest + off);
        });

        /* 3) стрілка відступає, поки роботи займають місце під нею */
        tip = clamp(Math.min(tip, minTop - 14), G.Ls, G.Llong);
        s.stem.style.height = tip + "px";
      });
      setYear(active);
    }

    var queued = false;
    function request() {
      if (queued) return; queued = true;
      requestAnimationFrame(function () { queued = false; frame(); });
    }
    window.addEventListener("scroll", request, { passive: true });
    window.addEventListener("resize", function () { measure(); request(); });
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { measure(); request(); });

    measure();
    frame();
  })();
  </script>
</body>
</html>
